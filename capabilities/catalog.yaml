version: 1
status: experimental
purpose: "Advisory capability metadata for routing, composition, evidence, and evolution signals."
capabilities:
  - id: workflow
    kind: macro-capability
    source_skill: skills/workflow/SKILL.md
    category: engineering
    stable: true
    default_mode: workflow/basic
    allowed_modes:
      - workflow/basic
      - workflow/extended
    intent: "Frame a task with explicit scope, proof, and next step before execution starts."
    evidence:
      - goal
      - immediate_scope
      - minimum_proof
      - next_step
    escalate_to_aletheia_if:
      - ownership_boundary_crossed
      - macro_gate_required

  - id: feature-planning
    kind: macro-capability
    source_skill: skills/feature-planning/SKILL.md
    category: engineering
    stable: true
    default_mode: workflow/extended
    allowed_modes:
      - workflow/basic
      - workflow/extended
      - workflow/high-risk
    intent: "Turn product intent into a small, testable delivery plan with scope, risks, slices, and proof."
    modules:
      - ambiguity-check
      - scope-boundary
      - smallest-viable-slice
      - dependency-map
      - risk-review
      - traceability-check
    evidence:
      - problem_statement
      - goal_and_non_goals
      - smallest_useful_slice
      - acceptance_evidence
    escalate_to_aletheia_if:
      - human_decision_required
      - readiness_blocked
      - cross_ownership_boundary

  - id: debugging
    kind: macro-capability
    source_skill: skills/debugging/SKILL.md
    category: engineering
    stable: true
    default_mode: debugging/root-cause
    allowed_modes:
      - debugging/quick-fix
      - debugging/root-cause
      - debugging/production-incident
    intent: "Reproduce, isolate, fix, and guard against recurrence instead of patching symptoms."
    modules:
      - instrumentation-pass
      - boundary-check
      - recurrence-guard
    evidence:
      - repro_path
      - likely_root_cause
      - validated_fix
      - recurrence_guard_or_rationale
    escalate_to_aletheia_if:
      - production_incident
      - cross_system_failure
      - human_approval_required


  - id: design-system-intelligence
    kind: micro-capability
    source_skill: skills/design-system-intelligence/SKILL.md
    category: design
    stable: false
    default_mode: workflow/extended
    allowed_modes:
      - workflow/extended
      - workflow/high-risk
    intent: "Review an artifact against a declared design system source bundle without promotion authority."
    modules:
      - pulso-pilot-mode
      - accessibility-evidence-check
      - pattern-candidate-review
      - observation-return
    evidence:
      - design_system_ref
      - artifact_refs
      - conformance_observations
      - candidate_findings
      - pattern_generalization_gate
      - owner_review_need
    escalate_to_aletheia_if:
      - design_system_owner_decision_required
      - pattern_promotion_requested
      - restricted_source_boundary

  - id: checkpoint-review
    kind: micro-capability
    source_skill: skills/checkpoint-review/SKILL.md
    category: efficiency
    stable: true
    default_mode: workflow/basic
    allowed_modes:
      - workflow/basic
      - workflow/extended
    intent: "Insert a short review pause so work can continue, stop, or hand off deliberately."
    evidence:
      - what_changed
      - what_is_proved
      - what_remains_open
      - continue_stop_or_handoff_decision
    escalate_to_aletheia_if:
      - macro_review_required
      - governance_gate_required

  - id: premortem
    kind: macro-capability
    source_skill: skills/premortem/SKILL.md
    category: planning
    stable: true
    default_mode: workflow/high-risk
    allowed_modes:
      - workflow/extended
      - workflow/high-risk
    intent: "Assume a future failure happened and work backwards before execution begins."
    modules:
      - assumption-stress-test
      - signal-log
      - rollback-gate
    evidence:
      - failure_modes
      - hidden_assumption
      - warning_signals
      - recommended_gates
      - revised_plan
    escalate_to_aletheia_if:
      - hard_gate_identified
      - human_decision_gate_required
      - high_assurance_context_missing

  - id: product-management
    kind: macro-capability
    source_skill: skills/product-management/SKILL.md
    category: product
    stable: false
    default_mode: product-management/diagnose
    allowed_modes:
      - product-management/diagnose
      - product-management/decision
      - product-management/composition
    intent: "Frame product work, select the smallest sufficient method path, and coordinate bounded handoffs without investment or roadmap authority."
    modules:
      - problem-framing
      - discovery-and-evidence
      - prioritization-and-method-selection
      - metrics-and-outcomes
      - stakeholder-alignment
      - strategy-and-opportunity
      - roadmap-and-sequencing
      - learning-review
    evidence:
      - problem_frame
      - decision_shape
      - evidence_quality
      - selected_modules
      - human_decisions
      - verification_result
      - handoff_targets
    escalate_to_aletheia_if:
      - investment_approval_required
      - roadmap_commitment_required
      - macro_gate_required
      - ownership_boundary_crossed

  - id: knowledge-entity-representation
    kind: macro-capability
    source_skill: domain-packs/ai-discovery-agent-experience/skills/knowledge-entity-representation/SKILL.md
    category: ai-discovery-agent-experience
    stable: false
    default_mode: workflow/extended
    allowed_modes:
      - workflow/basic
      - workflow/extended
      - workflow/high-risk
    intent: "Stabilize source-backed entities, relationships, claims, and canonical descriptions before downstream discovery work."
    modules:
      - entity-inventory
      - canonical-description-design
      - entity-consistency-audit
      - claim-evidence-mapping
      - knowledge-graph-readiness
      - machine-readable-packaging
      - version-and-freshness-governance
    evidence:
      - entity_inventory
      - relationship_map
      - claim_evidence_map
      - representation_findings
      - unresolved_conflicts
      - verification_handoff
    escalate_to_aletheia_if:
      - ownership_or_brand_decision_required
      - policy_or_legal_conflict
      - macro_priority_decision_required
