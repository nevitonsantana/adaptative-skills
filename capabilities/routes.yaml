version: 1
status: experimental
routes:
  - id: route.workflow.basic
    activates:
      - workflow
    when:
      task_size: small
      risk: low
      ambiguity: low
    mode: workflow/basic

  - id: route.feature-planning.ambiguous-feature
    activates:
      - workflow
      - feature-planning
    when:
      task_shape: feature_or_behavior_change
      ambiguity: medium_or_high
    mode: workflow/extended
    modules:
      - ambiguity-check
      - scope-boundary
      - smallest-viable-slice

  - id: route.feature-planning.high-risk
    activates:
      - workflow
      - feature-planning
      - premortem
    when:
      task_shape: feature_or_behavior_change
      failure_cost: meaningful
      direction_can_still_change: true
    mode: workflow/high-risk
    modules:
      - risk-review
      - traceability-check
      - rollback-gate
    escalation_hint: aletheia_readiness_gate

  - id: route.debugging.root-cause
    activates:
      - debugging
    when:
      task_shape: observed_failure
      cause_known: false
    mode: debugging/root-cause
    modules:
      - boundary-check
      - recurrence-guard

  - id: route.checkpoint.context-heavy
    activates:
      - checkpoint-review
    when:
      context_load: high
      next_step_unclear: true
    mode: workflow/basic

  - id: route.handoff.ownership-boundary
    activates:
      - checkpoint-review
    when:
      ownership_boundary_crossed: true
    mode: workflow/extended
    escalation_hint: use_handoff_summary_or_aletheia

  - id: route.design-system-intelligence.pulso-review
    activates:
      - design-system-intelligence
    when:
      task_shape: design_system_review
      design_system_ref: available
      artifact_claims_alignment: true
    mode: workflow/extended
    modules:
      - pulso-pilot-mode
      - pattern-candidate-review
    escalation_hint: aletheia_design_system_intelligence_review

  - id: route.product-management.ambiguous-request
    activates:
      - product-management
    when:
      task_shape: product_request
      ambiguity: medium_or_high
    mode: product-management/diagnose
    modules:
      - problem-framing
      - discovery-and-evidence
      - handoff-boundary
    escalation_hint: aletheia_product_decision_boundary

  - id: route.ai-discovery.entity-ambiguity
    activates:
      - knowledge-entity-representation
    when:
      task_shape: entity_or_claim_representation
      ambiguity: present
    mode: workflow/extended
    modules:
      - entity-inventory
      - entity-consistency-audit
      - claim-evidence-mapping
    escalation_hint: human_representation_owner

  - id: route.ai-discovery.search-foundations
    activates:
      - search-indexability-optimization
    when:
      task_shape: search_foundations_review
      property_scope: available
    mode: workflow/extended
    modules:
      - crawl-access-review
      - indexability-and-canonicalization-review
      - information-architecture-review
    escalation_hint: property_or_implementation_owner

  - id: route.ai-discovery.generative-baseline
    activates:
      - ai-discovery-measurement
      - generative-visibility-optimization
    when:
      task_shape: generative_visibility_baseline
      repeated_observations_required: true
    mode: workflow/extended
    escalation_hint: evidence_or_representation_owner

  - id: route.ai-discovery.pre-launch
    activates:
      - knowledge-entity-representation
      - search-indexability-optimization
      - ai-discovery-measurement
      - generative-visibility-optimization
    when:
      task_shape: pre_launch_discovery_review
      multiple_evidence_boundaries: true
    mode: workflow/high-risk
    escalation_hint: launch_decision_owner

  - id: route.ai-discovery.agent-action-readiness
    activates:
      - agent-capability-actionability
      - ai-discovery-measurement
    when:
      task_shape: agent_action_readiness
      state_change_possible: true
    mode: workflow/high-risk
    escalation_hint: authorization_and_implementation_owner

  - id: route.ai-discovery.ambiguous-goal
    activates:
      - ai-discovery-agent-experience
    when:
      task_shape: discovery_or_seo_request
      ambiguity: medium_or_high
    mode: workflow/extended
    modules:
      - goal-framing
      - dominant-question-classification
      - selective-composition
    escalation_hint: evidence_or_authorization_owner
