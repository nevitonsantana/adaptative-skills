version: 1
status: experimental
relationships:
  - from: workflow
    to: feature-planning
    relation: pairs-well-with
    reason: "Workflow frames the immediate scope before feature planning expands the plan."

  - from: feature-planning
    to: testing
    relation: expected-downstream-proof
    reason: "Feature plans should define acceptance evidence that testing can validate."

  - from: feature-planning
    to: premortem
    relation: optional-risk-deepening
    reason: "Premortem is justified when failure cost is meaningful and the plan can still change."

  - from: feature-planning
    to: checkpoint-review
    relation: optional-continuation-control
    reason: "Checkpoint review controls scope growth when planning expands mid-round."

  - from: workflow
    to: task-chunking
    relation: optional-scope-control
    reason: "Task chunking helps when a framed task is still too large for one round."

  - from: checkpoint-review
    to: handoff-summary
    relation: handoff-escalation
    reason: "A checkpoint may conclude that a clean restart or another owner is needed."


  - from: knowledge-entity-representation
    to: search-indexability-optimization
    relation: informs
    reason: "Stable entities and claims reduce ambiguity in search representation findings."

  - from: search-indexability-optimization
    to: generative-visibility-optimization
    relation: informs
    reason: "Search access and interpretation evidence can bound generative visibility hypotheses."

  - from: ai-discovery-measurement
    to: generative-visibility-optimization
    relation: evidence-prerequisite
    reason: "Generative visibility conclusions require a repeated, preserved baseline."

  - from: agent-capability-actionability
    to: ai-discovery-measurement
    relation: defines-observation-contract
    reason: "Capability states, effects, confirmation, and recovery define what action measurement should observe."

escalation_boundaries:
  - signal: human_decision_required
    owner: AletheIA or consumer governance layer
  - signal: macro_gate_required
    owner: AletheIA or consumer governance layer
  - signal: risky_state_change
    owner: agent runtime or harness
  - signal: skill_contract_change
    owner: Adaptive Skills Evolution Layer

  - from: design-system-intelligence
    to: heuristic-audit
    relation: optional-usability-deepening
    reason: "A design-system review may surface usability risks that need heuristic review rather than pattern promotion."

  - from: design-system-intelligence
    to: restricted-context-check
    relation: optional-source-boundary-check
    reason: "Design-system sources can be proprietary or restricted and may require metadata-only handling."

  - from: design-system-intelligence
    to: checkpoint-review
    relation: owner-review-escalation
    reason: "Pattern candidates or missing source evidence should pause for owner or governance review."

  - from: product-management
    to: feature-value-governance
    relation: delegates-to
    reason: "Product Management routes a bounded investment question to the canonical feature value contract."

  - from: product-management
    to: opportunity-tree-alignment
    relation: delegates-to
    reason: "Product Management uses opportunity alignment when a product bet needs an outcome-to-opportunity path."

  - from: product-management
    to: feature-planning
    relation: handoff-after-framing
    reason: "Delivery planning starts only after the product problem, outcome, and constraints are bounded."

  - from: product-management
    to: observability-review
    relation: composes-with
    reason: "Outcome and guardrail proposals need observability review before measurement claims are trusted."

  - from: product-management
    to: aletheia
    relation: escalation-boundary
    reason: "Investment, roadmap, macro-gate, and ownership decisions remain outside the portable skill."
